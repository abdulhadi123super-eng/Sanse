<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatApp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#111b21;color:#e9edef;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#202c33}

/* SETUP */
#setup{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:1.5rem;background:#111b21}
.scard{background:#202c33;border-radius:16px;padding:2rem;max-width:400px;width:100%}
.scard h2{font-size:1.2rem;font-weight:700;margin-bottom:.4rem;color:#00a884}
.scard p{color:#8696a0;font-size:.85rem;margin-bottom:1.25rem;line-height:1.6}
.sfield{margin-bottom:.85rem}
.sfield label{display:block;font-size:.75rem;font-weight:600;color:#8696a0;margin-bottom:.3rem}
.sfield input{width:100%;padding:.65rem 1rem;border-radius:8px;border:none;background:#2a3942;color:#e9edef;font-size:.88rem;outline:none}
.sfield input:focus{outline:2px solid #00a884}
.sbtn{width:100%;padding:.8rem;border-radius:10px;border:none;font-size:.95rem;font-weight:700;cursor:pointer;background:#00a884;color:#fff;transition:background .2s}
.sbtn:hover{background:#017561}
.snote{background:#2a3942;border-radius:8px;padding:.7rem 1rem;font-size:.78rem;color:#8696a0;line-height:1.7;margin-bottom:1rem}

/* AUTH */
#auth{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:1.5rem;background:#111b21}
.acard{background:#202c33;border-radius:16px;padding:2rem;max-width:380px;width:100%}
.acard .logo{text-align:center;margin-bottom:1.25rem}
.acard .logo div{font-size:3rem}
.acard .logo h1{font-size:1.4rem;font-weight:700;color:#00a884;margin-top:.3rem}
.acard .logo p{font-size:.82rem;color:#8696a0;margin-top:.2rem}
.google-btn{width:100%;padding:.75rem;border-radius:10px;border:none;background:#fff;color:#3c4043;font-size:.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.65rem;margin-bottom:1rem;transition:box-shadow .2s}
.google-btn:hover{box-shadow:0 2px 12px rgba(0,0,0,.3)}
.or-div{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;color:#8696a0;font-size:.8rem}
.or-div::before,.or-div::after{content:"";flex:1;height:1px;background:#2a3942}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{flex:1;padding:.55rem;border-radius:8px;border:1.5px solid #2a3942;background:none;color:#8696a0;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.tab.active{border-color:#00a884;background:rgba(0,168,132,.1);color:#00a884}
.tc{display:none}
.tc.active{display:block}
.ainp{width:100%;padding:.65rem 1rem;border-radius:8px;border:none;background:#2a3942;color:#e9edef;font-size:.88rem;outline:none;margin-bottom:.65rem}
.ainp:focus{outline:2px solid #00a884}
.abtn{width:100%;padding:.75rem;border-radius:10px;border:none;background:#00a884;color:#fff;font-size:.92rem;font-weight:700;cursor:pointer}
.aerr{background:#2a1a1a;border-radius:8px;padding:.6rem .9rem;font-size:.82rem;color:#f15c6d;margin-top:.65rem;display:none}
.alink{background:none;border:none;color:#8696a0;font-size:.78rem;cursor:pointer;text-decoration:underline;display:block;text-align:center;margin-top:.75rem}

/* APP */
#app{display:none;height:100%}
.grid{display:grid;grid-template-columns:320px 1fr;height:100%;padding-top:env(safe-area-inset-top,0px)}
@media(max-width:680px){
  .grid{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
}

/* SIDEBAR */
.sidebar{background:#111b21;display:flex;flex-direction:column;border-right:1px solid #2a3942}
.s-head{background:#202c33;padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem}
.av{width:38px;height:38px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:#fff;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.uname{flex:1;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:none;color:#8696a0;cursor:pointer;padding:.3rem;border-radius:50%;display:flex;transition:background .15s}
.ib:hover{background:#2a3942}
.s-search{padding:.6rem .75rem;background:#111b21}
.sinp{width:100%;padding:.5rem .85rem;border-radius:8px;border:none;background:#202c33;color:#e9edef;font-size:.88rem;outline:none}
.sinp:focus{outline:1px solid #00a884}
.rooms{flex:1;overflow-y:auto}
.rooms::-webkit-scrollbar{width:3px}
.rooms::-webkit-scrollbar-thumb{background:#2a3942}
.ritem{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem;cursor:pointer;border-bottom:1px solid #1f2c33;transition:background .15s}
.ritem:hover{background:#202c33}
.ritem.active{background:#2a3942}
.ric{width:46px;height:46px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.rname{font-weight:600;font-size:.92rem}
.rlast{font-size:.78rem;color:#8696a0;margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.add-room{margin:.75rem;padding:.65rem;border-radius:10px;background:rgba(0,168,132,.08);border:1.5px dashed #00a884;color:#00a884;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:all .2s}
.add-room:hover{background:#00a884;color:#fff}

/* CHAT */
.chat{display:flex;flex-direction:column;background:#0b141a;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.c-head{background:#202c33;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.mob-back{display:none;background:none;border:none;color:#aebac1;cursor:pointer}
@media(max-width:680px){.mob-back{display:flex}}
.c-info{flex:1;min-width:0}
.c-name{font-weight:600;font-size:.95rem}
.c-sub{font-size:.75rem;color:#8696a0}
.msgs{flex:1;overflow-y:auto;padding:.75rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:#2a3942;border-radius:2px}
.no-room{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;color:#8696a0}
.no-room .big{font-size:4rem}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:#8696a0;font-size:.88rem}
.date-sep{text-align:center;margin:.5rem 0}
.date-sep span{background:#182229;color:#8696a0;font-size:.72rem;padding:.2rem .7rem;border-radius:8px}
.mrow{display:flex;gap:.5rem;align-items:flex-end;margin:.1rem 0}
.mrow.me{flex-direction:row-reverse}
.mav{width:26px;height:26px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;overflow:hidden}
.mav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mbubbles{display:flex;flex-direction:column;gap:.1rem;max-width:68%}
.me .mbubbles{align-items:flex-end}
.msdr{font-size:.7rem;color:#00a884;padding:0 .4rem;margin-bottom:.1rem}
.bubble{padding:.5rem .8rem .35rem;border-radius:8px;font-size:.9rem;line-height:1.45;word-break:break-word;position:relative;background:#202c33;color:#e9edef}
.bubble:first-of-type{border-top-left-radius:8px}
.me .bubble{background:#005c4b;color:#e9edef;border-radius:8px}
.me .bubble:first-of-type{border-top-right-radius:8px}
.mtime{font-size:.65rem;color:#8696a0;padding:0 .4rem;text-align:right}
.tick{color:#53bdeb;margin-left:.2rem;font-size:.7rem}

/* INPUT */
.inp-wrap{background:#202c33;padding:.65rem .85rem;padding-bottom:calc(.65rem + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:.5rem;flex-shrink:0}
.minp{flex:1;padding:.6rem .9rem;border-radius:10px;border:none;background:#2a3942;color:#e9edef;font-size:.92rem;outline:none;resize:none;max-height:110px;font-family:inherit;line-height:1.4}
.minp:focus{outline:1px solid #00a884}
.send{width:40px;height:40px;border-radius:50%;background:#00a884;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.send:hover{background:#017561}
.send:disabled{opacity:.4;cursor:not-allowed}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px)}
.ov.open{display:flex}
.modal{background:#202c33;border-radius:14px;padding:1.75rem;max-width:360px;width:100%}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:1rem;color:#e9edef}
.modal input{width:100%;padding:.65rem .9rem;border-radius:8px;border:none;background:#2a3942;color:#e9edef;font-size:.9rem;outline:none;margin-bottom:.65rem}
.modal input:focus{outline:1px solid #00a884}
.mbtns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.25rem}
.mbtn2{padding:.55rem 1.2rem;border-radius:8px;border:none;font-size:.88rem;font-weight:600;cursor:pointer}
.mbtn-p{background:#00a884;color:#fff}
.mbtn-g{background:#2a3942;color:#8696a0}

/* TOAST */
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:#202c33;border-radius:8px;padding:.6rem 1.1rem;font-size:.85rem;z-index:999;opacity:0;transition:all .3s;pointer-events:none;color:#e9edef;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <div class="scard">
    <div style="font-size:2.2rem;margin-bottom:.5rem">💬</div>
    <h2>ChatApp Setup</h2>
    <p>Supabase URL aur Key darain</p>
    <div class="snote">supabase.com → project → Settings → API mein milti hain</div>
    <div class="sfield"><label>SUPABASE URL</label><input id="cfg-url" placeholder="https://xxx.supabase.co" type="url"></div>
    <div class="sfield"><label>ANON KEY</label><input id="cfg-key" placeholder="eyJhbG..." type="text"></div>
    <button class="sbtn" onclick="saveSetup()">Connect →</button>
  </div>
</div>

<!-- AUTH -->
<div id="auth">
  <div class="acard">
    <div class="logo">
      <div>💬</div>
      <h1>ChatApp</h1>
      <p>Apne dosto se baat karein</p>
    </div>
    <button class="google-btn" onclick="signGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.6 0 6.6 5.6 2.7 13.8l7.8 6c1.8-5.5 6.9-10.3 13.5-10.3z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.2-10 7.2-17z"/><path fill="#FBBC05" d="M10.5 28.8c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.8-6C1 16.3 0 20 0 24s1 7.7 2.7 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.8 2.2-6.5 0-12-4.4-14-10.3l-7.8 6C6.6 42.4 14.6 48 24 48z"/></svg>
      Google se Login
    </button>
    <div class="or-div">ya email se</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div class="tc active" id="tc-login">
      <input class="ainp" id="l-email" type="email" placeholder="Email">
      <input class="ainp" id="l-pass" type="password" placeholder="Password">
      <button class="abtn" onclick="doLogin()">Login</button>
    </div>
    <div class="tc" id="tc-signup">
      <input class="ainp" id="s-name" type="text" placeholder="Naam">
      <input class="ainp" id="s-email" type="email" placeholder="Email">
      <input class="ainp" id="s-pass" type="password" placeholder="Password (6+ chars)">
      <button class="abtn" onclick="doSignup()">Account Banao</button>
    </div>
    <div class="aerr" id="aerr"></div>
    <button class="alink" onclick="showSetup()">⚙️ Settings</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="grid">
    <aside class="sidebar" id="sidebar">
      <div class="s-head">
        <div class="av" id="nav-av"><span id="nav-init">U</span></div>
        <div class="uname" id="nav-name">User</div>
        <button class="ib" onclick="doLogout()" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
      <div class="s-search"><input class="sinp" placeholder="🔍 Room dhoondo..." oninput="filterRooms(this.value)"></div>
      <div class="rooms" id="rooms-list"></div>
      <button class="add-room" onclick="openRoomModal()">+ Nai Room Banao</button>
    </aside>
    <main class="chat">
      <div class="c-head">
        <button class="mob-back" onclick="closeSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="av" style="width:40px;height:40px" id="ch-av">💬</div>
        <div class="c-info">
          <div class="c-name" id="ch-name">Room chunein</div>
          <div class="c-sub" id="ch-sub">ChatApp</div>
        </div>
        <button class="ib" onclick="openSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <div class="msgs" id="msgs">
        <div class="no-room"><div class="big">💬</div><div>Koi room chunein</div></div>
      </div>
      <div class="inp-wrap" id="inp-wrap" style="display:none">
        <textarea class="minp" id="msg-inp" placeholder="Message..." rows="1" onkeydown="onKey(event)" oninput="autoH(this)"></textarea>
        <button class="send" id="send-btn" onclick="sendMsg()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </main>
  </div>
</div>

<!-- Room Modal -->
<div class="ov" id="room-ov" onclick="if(event.target===this)closeRoomModal()">
  <div class="modal">
    <h3>Nai Room</h3>
    <input id="r-name" type="text" placeholder="Room naam (e.g. General)">
    <input id="r-emoji" type="text" placeholder="Emoji (e.g. 🎮)" maxlength="4" value="💬">
    <div class="mbtns">
      <button class="mbtn2 mbtn-g" onclick="closeRoomModal()">Cancel</button>
      <button class="mbtn2 mbtn-p" onclick="createRoom()">Banao</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const UK='ca_url', KK='ca_key';
let SURL=localStorage.getItem(UK)||'https://bzfopprzhgiqfpczhher.supabase.co';
let SKEY=localStorage.getItem(KK)||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6Zm9wcHJ6aGdpcWZwY3poaGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTMwMTAsImV4cCI6MjEwODkyOTAxMH0.zfl2uoqovUzFVV3v8Pjdlz-vfdJ9qhPNyri0qMggnws';
let sb=null, me=null, curRoom=null, rooms=[], rtCh=null;

async function init(){
  try{
    sb=window.supabase.createClient(SURL,SKEY);
    const {data:{session}}=await sb.auth.getSession();
    if(session){me=session.user;showApp();}
    else show('auth');
    sb.auth.onAuthStateChange((e,s)=>{
      if(e==='SIGNED_IN'&&s){me=s.user;showApp();}
      else if(e==='SIGNED_OUT'){me=null;curRoom=null;show('auth');}
    });
  }catch(e){show('setup');}
}

function show(s){
  document.getElementById('setup').style.display=s==='setup'?'flex':'none';
  document.getElementById('auth').style.display=s==='auth'?'flex':'none';
  document.getElementById('app').style.display=s==='app'?'block':'none';
}

async function showApp(){
  show('app');
  const name=me?.user_metadata?.full_name||me?.user_metadata?.name||me?.email?.split('@')[0]||'User';
  const pic=me?.user_metadata?.avatar_url||me?.user_metadata?.picture||'';
  document.getElementById('nav-name').textContent=name;
  const av=document.getElementById('nav-av');
  if(pic){av.innerHTML=`<img src="${pic}" alt="">`;}
  else{av.innerHTML=`<span>${name[0].toUpperCase()}</span>`;}
  await upsertProfile();
  loadRooms();
}

async function upsertProfile(){
  if(!me||!sb)return;
  const meta=me.user_metadata;
  try{
    await sb.from('profiles').upsert({
      id:me.id,email:me.email,
      full_name:meta?.full_name||meta?.name||me.email?.split('@')[0]||'User',
      avatar_url:meta?.avatar_url||meta?.picture||''
    },{onConflict:'id'});
  }catch(e){console.warn(e);}
}

function saveSetup(){
  const url=document.getElementById('cfg-url').value.trim();
  const key=document.getElementById('cfg-key').value.trim();
  if(!url||!key){toast('URL aur Key darain!');return;}
  localStorage.setItem(UK,url);localStorage.setItem(KK,key);
  SURL=url;SKEY=key;location.reload();
}
function showSetup(){show('setup');}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===(t==='login'?0:1)));
  document.querySelectorAll('.tc').forEach((c,i)=>c.classList.toggle('active',i===(t==='login'?0:1)));
}

async function signGoogle(){
  const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});
  if(error)showErr(error.message);
}

async function doLogin(){
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!email||!pass){showErr('Email aur password darain!');return;}
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)showErr('Email ya password galat hai!');
}

async function doSignup(){
  const name=document.getElementById('s-name').value.trim();
  const email=document.getElementById('s-email').value.trim();
  const pass=document.getElementById('s-pass').value;
  if(!name||!email||!pass){showErr('Sab fields zaroori hain!');return;}
  if(pass.length<6){showErr('Password 6+ characters hona chahiye!');return;}
  const{error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(error)showErr(error.message);
  else{toast('Account ban gaya! Email confirm karo ✅');switchTab('login');}
}

async function doLogout(){await sb?.auth.signOut();if(rtCh)sb.removeChannel(rtCh);}
function showErr(m){const e=document.getElementById('aerr');e.textContent=m;e.style.display='block';}

async function loadRooms(){
  try{
    const{data,error}=await sb.from('rooms').select('*').order('created_at',{ascending:true});
    if(error)throw error;
    rooms=data||[];
    if(!rooms.length)await seedRooms();
    else renderRooms(rooms);
  }catch(e){
    document.getElementById('rooms-list').innerHTML='<div style="padding:1rem;color:#f15c6d;font-size:.82rem;text-align:center">⚠️ Tables nahi hain — SQL run karo</div>';
  }
}

async function seedRooms(){
  const{data}=await sb.from('rooms').insert([
    {name:'General',emoji:'💬',created_by:me.id},
    {name:'Random',emoji:'🎲',created_by:me.id},
  ]).select();
  rooms=data||[];renderRooms(rooms);
}

function renderRooms(list){
  const el=document.getElementById('rooms-list');
  if(!list.length){el.innerHTML='<div style="padding:1rem;text-align:center;color:#8696a0;font-size:.82rem">Koi room nahi</div>';return;}
  el.innerHTML=list.map(r=>`
    <div class="ritem${curRoom?.id===r.id?' active':''}" onclick="selectRoom(${r.id})">
      <div class="ric">${r.emoji||'💬'}</div>
      <div><div class="rname">${esc(r.name)}</div><div class="rlast">Tap karo →</div></div>
    </div>`).join('');
}

function filterRooms(q){renderRooms(q?rooms.filter(r=>r.name.toLowerCase().includes(q.toLowerCase())):rooms);}

async function selectRoom(id){
  curRoom=rooms.find(r=>r.id===id);
  if(!curRoom)return;
  renderRooms(rooms);
  document.getElementById('ch-av').textContent=curRoom.emoji||'💬';
  document.getElementById('ch-name').textContent=curRoom.name;
  document.getElementById('ch-sub').textContent='Real-time chat';
  document.getElementById('inp-wrap').style.display='flex';
  closeSidebar();
  await loadMsgs();
  subscribeRoom();
}

async function loadMsgs(){
  if(!curRoom||!sb)return;
  try{
    const{data,error}=await sb.from('messages')
      .select('*,profiles:sender_id(full_name,avatar_url)')
      .eq('room_id',curRoom.id)
      .order('created_at',{ascending:true})
      .limit(100);
    if(error)throw error;
    renderMsgs(data||[]);
  }catch(e){console.error('loadMsgs error:',e);}
}

function renderMsgs(list){
  const el=document.getElementById('msgs');
  if(!list.length){el.innerHTML='<div class="empty"><span style="font-size:2.5rem">👋</span><div>Pehla message bhejo!</div></div>';return;}
  let html='',lastDate='',lastSender='';
  list.forEach(m=>{
    const d=new Date(m.created_at);
    const ds=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    if(ds!==lastDate){html+=`<div class="date-sep"><span>${ds}</span></div>`;lastDate=ds;lastSender='';}
    const isMe=m.sender_id===me?.id;
    const name=m.profiles?.full_name||'User';
    const pic=m.profiles?.avatar_url||'';
    const init=name[0]?.toUpperCase()||'U';
    const t=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    const showAv=lastSender!==m.sender_id;
    lastSender=m.sender_id;
    const avHtml=pic?`<img src="${esc(pic)}" alt="">`:`<span>${init}</span>`;
    html+=`<div class="mrow${isMe?' me':''}">
      ${showAv?`<div class="mav">${avHtml}</div>`:`<div style="width:26px"></div>`}
      <div class="mbubbles">
        ${showAv&&!isMe?`<div class="msdr">${esc(name)}</div>`:''}
        <div class="bubble">${esc(m.content)}</div>
        <div class="mtime">${t}${isMe?'<span class="tick">✓✓</span>':''}</div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

function subscribeRoom(){
  if(rtCh){sb.removeChannel(rtCh);rtCh=null;}
  if(!curRoom)return;
  rtCh=sb.channel(`msgs-${curRoom.id}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room_id=eq.${curRoom.id}`},
      payload=>{
        console.log('New msg:',payload);
        loadMsgs();
      })
    .subscribe(status=>{
      console.log('Realtime status:',status);
    });
}

async function sendMsg(){
  const inp=document.getElementById('msg-inp');
  const txt=inp.value.trim();
  if(!txt||!curRoom||!me)return;
  inp.value='';inp.style.height='';
  document.getElementById('send-btn').disabled=true;
  try{
    const{error}=await sb.from('messages').insert({
      room_id:curRoom.id,
      sender_id:me.id,
      content:txt
    });
    if(error){console.error('Send error:',error);inp.value=txt;toast('Message send nahi hua: '+error.message);}
    else await loadMsgs();
  }catch(e){console.error(e);inp.value=txt;}
  document.getElementById('send-btn').disabled=false;
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoH(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}

function openRoomModal(){document.getElementById('room-ov').classList.add('open');document.getElementById('r-name').focus();}
function closeRoomModal(){document.getElementById('room-ov').classList.remove('open');}
async function createRoom(){
  const name=document.getElementById('r-name').value.trim();
  const emoji=document.getElementById('r-emoji').value.trim()||'💬';
  if(!name)return;
  const{data,error}=await sb.from('rooms').insert({name,emoji,created_by:me.id}).select().single();
  if(error){toast('Error: '+error.message);return;}
  rooms.push(data);renderRooms(rooms);closeRoomModal();selectRoom(data.id);
}

function openSidebar(){document.getElementById('sidebar').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let toastT;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3000);}

init();
</script>
</body>
</html>
